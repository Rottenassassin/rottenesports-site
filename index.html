<!DOCTYPE html>
<html class="theme-dark" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rotten Esports (RTN)</title>
    <link rel="icon" type="image/png" href="images/avatar.png">
    <meta name="description" content="Rotten Esports (RTN) - Fortnite and Rainbow Six Siege team. Streams, clips, socials and contact.">
    <link rel="canonical" href="https://rottenesports.com">
    <meta name="author" content="Rotten Esports">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
    <!-- ROTTEN COLORS - change these to restyle the page -->
    <style>
      body { background:#000000; color:#FFFFFF; }
      h1 { color:#39FF14; letter-spacing:2px; }
      .avatar { border:3px solid #39FF14; width:200px; height:200px; }
      .button { border-color:#39FF14 !important; }
      .button:hover { box-shadow:0 0 12px #39FF14; }
      footer, footer a { color:#39FF14; }
    </style>
  </head>
<body>
  <div class="container">
    <div class="column">
      <main>
        <!-- LOGO: swap images/avatar.png to change it -->
        <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="Rotten Esports logo" width="200" height="200" fetchpriority="high">
        <!-- NAME -->
        <h1>ROTTEN ESPORTS</h1>
        <!-- BIO -->
        <p>RTN &middot; Fortnite &amp; Rainbow Six Siege</p>
        <!-- BUTTONS: change href="..." to change where each one goes -->
        <nav class="button-stack" aria-label="Links">
          <a class="button button-twitch" href="https://twitch.tv/rottenesports" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/twitch.svg" alt="">Twitch</a>
          <a class="button button-yt" href="https://youtube.com/@RottenEsports" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="">YouTube</a>
          <a class="button button-x" href="https://x.com/RottenEsports" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/x.svg" alt="">X</a>
          <a class="button button-instagram" href="https://instagram.com/rottenesports" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="">Instagram</a>
          <a class="button button-threads" href="https://threads.net/@rottenesports" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/threads.svg" alt="">Threads</a>
          <!-- DISCORD: replace YOUR-INVITE with your invite code -->
          <span class="button button-discord" style="opacity:.55;cursor:default"><img class="icon" aria-hidden="true" src="images/icons/discord.svg" alt="">Discord &middot; Coming Soon</span>
          <!-- TIKTOK: delete this comment line and the END line below once you have the account
          <a class="button button-tiktok" href="https://tiktok.com/@rottenesports" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="">TikTok</a>
          END TIKTOK -->
          <a class="button button-default" href="mailto:contact@rottenesports.com"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="">Contact / Sponsors</a>
        </nav>
      </main>
      <footer>&copy; 2026 Rotten Esports</footer>
    </div>
  </div>
</body>
</html>
